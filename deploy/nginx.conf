# P0 单机部署（HTTP，备案前 / IP 联调阶段使用）
# upstream 使用 compose 服务名 app；裸机部署时改为 127.0.0.1:8080
# 证书签发后改用 nginx-ssl.conf.example

upstream watch_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name bigger.ink www.bigger.ink api.bigger.ink _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json text/event-stream;

    # 前端 baseURL = /api/v1；后端 Controller 无 /v1，前缀在此剥离
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://watch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # SSE 必须单独关缓冲，否则事件被攒着不发
    location = /api/v1/stream/events {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://watch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
